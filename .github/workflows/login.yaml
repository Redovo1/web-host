name: Run Login Script

on:
  workflow_dispatch:
  schedule:
    - cron: "22 3 11 * *"  # 每月11号运行一次
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  login:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 仓库代码
        uses: actions/checkout@v4

      - name: 安装 Playwright 所需依赖
        run: |
          npx playwright install-deps

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright Browsers  # 安装浏览器
        run: |
          playwright install

      - name: 运行登录脚本
        env:
          # 推荐：一个账号一个 secret，加账号不用改老的
          WEBHOST_1: ${{ secrets.WEBHOST_1 }}
          WEBHOST_2: ${{ secrets.WEBHOST_2 }}
          WEBHOST_3: ${{ secrets.WEBHOST_3 }}
          WEBHOST_4: ${{ secrets.WEBHOST_4 }}
          WEBHOST_5: ${{ secrets.WEBHOST_5 }}
          WEBHOST_6: ${{ secrets.WEBHOST_6 }}
          WEBHOST_7: ${{ secrets.WEBHOST_7 }}
          WEBHOST_8: ${{ secrets.WEBHOST_8 }}
          WEBHOST_9: ${{ secrets.WEBHOST_9 }}
          WEBHOST_10: ${{ secrets.WEBHOST_10 }}
          # 兼容老写法（可选）：一个 secret 里多行 email:password
          WEBHOST: ${{ secrets.WEBHOST }}
        run: |
          python login_script.py

      - name: Update timestamp to keep workflow active
        run: |
          date > last_run_timestamp.txt

      - name: Commit and push timestamp
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git pull

          git add last_run_timestamp.txt
          git commit -m "Automated timestamp update to keep workflow active [skip ci]"
          git push
